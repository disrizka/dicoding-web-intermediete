<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story App</title>
  <link rel="shortcut icon" href="favicon.png" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
    defer
  ></script>

  <!-- Main CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Skip Link for Accessibility -->
  <a href="#main-content" class="skip-to-content">Skip to Content</a>

  <!-- Header -->
  <header>
    <div class="main-header container">
      <a class="brand-name" href="#/">Story App</a>

      <nav id="navigation-drawer" class="navigation-drawer" aria-label="Main navigation">
        <ul id="nav-list" class="nav-list">
          <li><a href="#/">Home</a></li>
          <li><a href="#/about">About</a></li>
          <li id="add-story-menu" style="display: none;"><a href="#/add-story">Add Story</a></li>
          <li id="logout-menu" style="display: none;"><a href="#" id="logout-button">Logout</a></li>
        </ul>
      </nav>

      <button id="drawer-button" class="drawer-button" aria-label="Toggle navigation menu">☰</button>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="main-content" tabindex="-1"></main>

  <!-- Global Script (SPA App Logic) -->
  <script>
    function showMenusIfLoggedIn() {
      const token = localStorage.getItem("token");
      const logoutMenu = document.getElementById("logout-menu");
      const addStoryMenu = document.getElementById("add-story-menu");

      if (logoutMenu && addStoryMenu) {
        logoutMenu.style.display = token ? "inline-block" : "none";
        addStoryMenu.style.display = token ? "inline-block" : "none";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      showMenusIfLoggedIn();
    });

    document.addEventListener("click", (e) => {
      if (e.target.id === "logout-button") {
        localStorage.clear();
        window.location.hash = "#/login";
        location.reload();
      }
    });

    window.showMenusIfLoggedIn = showMenusIfLoggedIn;
  </script>

  <!-- Entry Point Script -->
  <script type="module" src="scripts/index.js"></script>
</body>
</html>
